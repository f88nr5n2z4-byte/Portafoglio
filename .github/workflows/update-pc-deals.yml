name: Update PC Deal Forge offers
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify product pages
        run: node pc-deal-forge/check-offers.mjs
      - name: Commit changed offer feed
        run: |
          if git diff --quiet -- pc-deal-forge/offers-live.json; then
            echo "No offer changes"
            exit 0
          fi
          git config user.name "pc-deal-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- pc-deal-forge/offers-live.json
          git commit -m "Refresh verified PC offers"
          git push
