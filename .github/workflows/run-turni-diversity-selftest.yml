name: Run Turni diversity self-test

on:
  push:
    paths:
      - '.github/workflows/run-turni-diversity-selftest.yml'
      - '.github/scripts/patch_turni_rest_congedo.py'

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Turni
        run: python .github/scripts/patch_turni_rest_congedo.py
      - name: Check JavaScript
        run: node --check turni-v2/app-current.js
      - name: Commit update
        run: |
          git config user.name 'turni-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add turni-v2/app-current.js turni-v2/index.html turni-v2/sw.js
          git commit -m 'Add riposo and congedo to Turni' || exit 0
          git push
