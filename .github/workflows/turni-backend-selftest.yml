name: Turni backend selftest
on:
  push:
    paths:
      - '.github/workflows/turni-backend-selftest.yml'
      - 'turni-v2/SELFTEST-TRIGGER.txt'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Supabase selftest
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://dlqrhteqodkdkvmrwktu.supabase.co/functions/v1/turni-mixed-absence-selftest-20260914'
