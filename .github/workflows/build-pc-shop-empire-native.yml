name: Build PC GAME EMPIRE Native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pc-shop-empire-godot/**"
      - ".github/workflows/build-pc-shop-empire-native.yml"
  pull_request:
    paths:
      - "pc-shop-empire-godot/**"
      - ".github/workflows/build-pc-shop-empire-native.yml"

permissions:
  contents: read

concurrency:
  group: pc-game-empire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-windows-gate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Clean import cache and old builds
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "pc-shop-empire-godot\.godot" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

      - name: Import project
        shell: powershell
        run: |
          $godot = (Get-ChildItem "$HOME\godot\*console.exe" | Select-Object -First 1).FullName
          if (!(Test-Path $godot)) { throw "Godot console executable not found" }
          & $godot --headless --path pc-shop-empire-godot --editor --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed: $LASTEXITCODE" }

      - name: Run native beta QA
        shell: powershell
        run: |
          $godot = (Get-ChildItem "$HOME\godot\*console.exe" | Select-Object -First 1).FullName
          & $godot --headless --audio-driver Dummy --path pc-shop-empire-godot --script res://qa_beta.gd
          if ($LASTEXITCODE -ne 0) { throw "Native beta QA failed: $LASTEXITCODE" }

      - name: Export clean Windows build
        shell: powershell
        run: |
          $godot = (Get-ChildItem "$HOME\godot\*console.exe" | Select-Object -First 1).FullName
          & $godot --headless --path pc-shop-empire-godot --export-release "Windows Desktop" "$env:GITHUB_WORKSPACE\build\PC-GAME-EMPIRE.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed: $LASTEXITCODE" }

      - name: Verify exported executable
        shell: powershell
        run: |
          $exe = "build\PC-GAME-EMPIRE.exe"
          if (!(Test-Path $exe)) { throw "EXE missing after export" }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) { throw "EXE unexpectedly small: $size bytes" }
          Write-Host "Exported EXE size: $size bytes"

      - name: Launch exported EXE on Windows
        shell: powershell
        run: |
          $out = "$PWD\build\exe_stdout.log"
          $err = "$PWD\build\exe_stderr.log"
          $p = Start-Process -FilePath "$PWD\build\PC-GAME-EMPIRE.exe" -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","120" -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Exported EXE exited with code $($p.ExitCode)" }
          $all = ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $err -Raw -ErrorAction SilentlyContinue))
          if ($all -match "SCRIPT ERROR|Parse Error") { throw "Runtime script/parse error detected in exported EXE" }
          Write-Host "PC-GAME-EMPIRE.exe launch smoke test PASSED"

      - name: Package final ZIP
        shell: powershell
        run: |
          $zip = "build\PC_GAME_EMPIRE_BETA_v0.1.0_WINDOWS.zip"
          Compress-Archive -Path "build\PC-GAME-EMPIRE.exe" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path $zip)) { throw "ZIP missing" }
          if ((Get-Item $zip).Length -lt 1000000) { throw "ZIP unexpectedly small" }
          Write-Host "ZIP size: $((Get-Item $zip).Length) bytes"

      - name: Verify ZIP by extracting and relaunching EXE
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "verify_extract" -ErrorAction SilentlyContinue
          Expand-Archive -Path "build\PC_GAME_EMPIRE_BETA_v0.1.0_WINDOWS.zip" -DestinationPath "verify_extract" -Force
          if (!(Test-Path "verify_extract\PC-GAME-EMPIRE.exe")) { throw "EXE missing from extracted ZIP" }
          $out = "$PWD\verify_extract\zip_exe_stdout.log"
          $err = "$PWD\verify_extract\zip_exe_stderr.log"
          $p = Start-Process -FilePath "$PWD\verify_extract\PC-GAME-EMPIRE.exe" -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","120" -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "EXE from extracted ZIP exited with code $($p.ExitCode)" }
          $all = ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $err -Raw -ErrorAction SilentlyContinue))
          if ($all -match "SCRIPT ERROR|Parse Error") { throw "Runtime script/parse error detected in EXE extracted from ZIP" }
          Write-Host "Extracted ZIP EXE smoke test PASSED"

      - name: Upload final Windows beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC_GAME_EMPIRE_BETA_v0.1.0_WINDOWS
          path: build/PC_GAME_EMPIRE_BETA_v0.1.0_WINDOWS.zip
          if-no-files-found: error
