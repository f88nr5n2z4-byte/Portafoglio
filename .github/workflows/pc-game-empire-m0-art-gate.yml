name: PC GAME EMPIRE M0 Art Final Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pc-shop-empire-godot/game/**"
      - "pc-shop-empire-godot/qa_milestone0_real_world.gd"
      - "pc-shop-empire-godot/qa_m0_art_world.gd"
      - "pc-shop-empire-godot/qa_m0_visual_gate.gd"
      - "pc-shop-empire-godot/qa_parse_chain.gd"
      - ".github/workflows/pc-game-empire-m0-art-gate.yml"

permissions:
  contents: read

jobs:
  m0-art-final-gate:
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Clean and import
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "pc-shop-empire-godot\.godot" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          $godot = "$HOME\godot\Godot_v4.7.2-stable_win64.exe"
          $p = Start-Process -FilePath $godot -ArgumentList "--headless","--path","pc-shop-empire-godot","--editor","--quit" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Godot import failed: $($p.ExitCode)" }

      - name: Strict parser
        shell: powershell
        run: |
          $godot = "$HOME\godot\Godot_v4.7.2-stable_win64.exe"
          $out="$PWD\build\parse_stdout.log"; $err="$PWD\build\parse_stderr.log"
          $p=Start-Process -FilePath $godot -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","180","--path","pc-shop-empire-godot","--script","res://qa_parse_chain.gd" -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          $all=(Get-Content $out -Raw -ErrorAction SilentlyContinue)+"`n"+(Get-Content $err -Raw -ErrorAction SilentlyContinue); Write-Host $all
          if ($p.ExitCode -ne 0 -or $all -notmatch "PARSE CHAIN: ALL SCRIPTS INSTANTIABLE") { throw "Strict parser failed" }

      - name: Existing real-world regression QA
        shell: powershell
        run: |
          $godot = "$HOME\godot\Godot_v4.7.2-stable_win64.exe"
          $out="$PWD\build\m0_world_stdout.log"; $err="$PWD\build\m0_world_stderr.log"
          $p=Start-Process -FilePath $godot -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","900","--path","pc-shop-empire-godot","--script","res://qa_milestone0_real_world.gd" -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          $all=(Get-Content $out -Raw -ErrorAction SilentlyContinue)+"`n"+(Get-Content $err -Raw -ErrorAction SilentlyContinue); Write-Host $all
          if ($p.ExitCode -ne 0 -or $all -notmatch "MILESTONE 0 REAL-WORLD QA: ALL TESTS PASSED") { throw "Real-world regression failed" }

      - name: Art animation door occlusion runtime QA
        shell: powershell
        run: |
          $godot = "$HOME\godot\Godot_v4.7.2-stable_win64.exe"
          $out="$PWD\build\m0_art_stdout.log"; $err="$PWD\build\m0_art_stderr.log"
          $p=Start-Process -FilePath $godot -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","900","--path","pc-shop-empire-godot","--script","res://qa_m0_art_world.gd" -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          $all=(Get-Content $out -Raw -ErrorAction SilentlyContinue)+"`n"+(Get-Content $err -Raw -ErrorAction SilentlyContinue); Write-Host $all
          if ($p.ExitCode -ne 0 -or $all -notmatch "M0 ART/RUNTIME QA: ALL TESTS PASSED") { throw "M0 art/runtime QA failed" }

      - name: Capture 12 real 1920x1080 visual gate frames
        shell: powershell
        run: |
          $godot = "$HOME\godot\Godot_v4.7.2-stable_win64.exe"
          New-Item -ItemType Directory -Force -Path "build\m0_visual_gate" | Out-Null
          $out="$PWD\build\visual_stdout.log"; $err="$PWD\build\visual_stderr.log"
          $argLine="--audio-driver Dummy --rendering-method gl_compatibility --path pc-shop-empire-godot --script res://qa_m0_visual_gate.gd"
          $p=Start-Process -FilePath $godot -ArgumentList $argLine -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          $all=(Get-Content $out -Raw -ErrorAction SilentlyContinue)+"`n"+(Get-Content $err -Raw -ErrorAction SilentlyContinue); Write-Host $all
          if ($p.ExitCode -ne 0 -or $all -notmatch "M0 VISUAL GATE CAPTURE: PASS") { throw "M0 visual capture failed" }
          $files=Get-ChildItem "build\m0_visual_gate\*.png"
          if ($files.Count -ne 12) { throw "Expected 12 screenshots, got $($files.Count)" }
          foreach ($f in $files) { if ($f.Length -lt 30000) { throw "Screenshot unexpectedly small: $($f.Name) $($f.Length)" } }

      - name: Export Windows M0 candidate
        shell: powershell
        run: |
          $godot = "$HOME\godot\Godot_v4.7.2-stable_win64.exe"
          $outPath="$env:GITHUB_WORKSPACE\build\PC-GAME-EMPIRE-M0-ART.exe"
          $exportOut="$PWD\build\export_stdout.log"; $exportErr="$PWD\build\export_stderr.log"
          $argLine="--headless --path pc-shop-empire-godot --export-release `"Windows Desktop`" `"$outPath`""
          $p=Start-Process -FilePath $godot -ArgumentList $argLine -RedirectStandardOutput $exportOut -RedirectStandardError $exportErr -Wait -PassThru
          $all=(Get-Content $exportOut -Raw -ErrorAction SilentlyContinue)+"`n"+(Get-Content $exportErr -Raw -ErrorAction SilentlyContinue); Write-Host $all
          if ($p.ExitCode -ne 0 -or !(Test-Path $outPath)) { throw "Windows export failed" }
          if ((Get-Item $outPath).Length -lt 10000000) { throw "EXE unexpectedly small" }

      - name: Launch exported EXE
        shell: powershell
        run: |
          $out="$PWD\build\exe_stdout.log"; $err="$PWD\build\exe_stderr.log"
          $p=Start-Process -FilePath "$PWD\build\PC-GAME-EMPIRE-M0-ART.exe" -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","180" -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          $all=(Get-Content $out -Raw -ErrorAction SilentlyContinue)+"`n"+(Get-Content $err -Raw -ErrorAction SilentlyContinue); Write-Host $all
          if ($p.ExitCode -ne 0 -or $all -match "SCRIPT ERROR|Parse Error") { throw "Exported EXE runtime failed" }

      - name: Package extract and relaunch
        shell: powershell
        run: |
          Compress-Archive -Path "build\PC-GAME-EMPIRE-M0-ART.exe" -DestinationPath "build\PC_GAME_EMPIRE_M0_ART_WINDOWS.zip" -CompressionLevel Optimal -Force
          Remove-Item -Recurse -Force "verify_m0_art" -ErrorAction SilentlyContinue
          Expand-Archive "build\PC_GAME_EMPIRE_M0_ART_WINDOWS.zip" "verify_m0_art" -Force
          $p=Start-Process -FilePath "$PWD\verify_m0_art\PC-GAME-EMPIRE-M0-ART.exe" -ArgumentList "--headless","--audio-driver","Dummy","--quit-after","180" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Extracted EXE launch failed" }

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: PC_GAME_EMPIRE_M0_ART_WINDOWS
          path: build/PC_GAME_EMPIRE_M0_ART_WINDOWS.zip
          if-no-files-found: error

      - name: Upload M0 visual gate screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PC_GAME_EMPIRE_M0_VISUAL_GATE_12_SHOTS
          path: build/m0_visual_gate/*.png
          if-no-files-found: error
