<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0067b1"><title>Aggiornamento Eurospin Turni</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f4f8fb;color:#003d7c;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:420px;background:white;border-radius:20px;padding:24px;box-shadow:0 12px 35px rgba(0,70,130,.12);text-align:center}b{display:block;font-size:22px;margin-bottom:8px}.spin{font-size:34px}</style></head><body><div class="box"><div class="spin">↻</div><b>Aggiornamento in corso</b><span>Sto eliminando la vecchia cache e caricando la versione 55.</span></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}localStorage.removeItem('tm_force_sw_v54');localStorage.removeItem('tm_force_sw_v53');localStorage.removeItem('tm_force_sw_v52');localStorage.removeItem('tm_force_sw_v51');}catch(e){}location.replace('index.html?v=55&fresh='+Date.now())})()</script></body></html>
