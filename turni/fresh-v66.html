<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0067b1"><title>Aggiornamento Turni v66</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f8fb;color:#003d7c;padding:28px;text-align:center}b{font-size:22px}</style></head><body><b>Aggiornamento turni…</b><p>Elimino cache e bozza vecchia e apro il generatore mensile v66.</p><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));for(const k of Object.keys(localStorage))if(k.startsWith('tm_force_sw_v'))localStorage.removeItem(k);localStorage.removeItem('tm_planner_draft')}catch(e){}location.replace('new-turns.html?v=66&fresh='+Date.now())})()</script></body></html>
