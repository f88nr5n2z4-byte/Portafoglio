<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0067b1"><title>Reset Turnistica v90</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#003d7c;margin:0;padding:24px}.box{max-width:520px;margin:15vh auto;background:#fff;border:1px solid #dbe5ec;border-radius:20px;padding:22px;border-bottom:6px solid #ffd100}</style></head><body><div class="box"><b>Reset completo turnistica</b><p id="s">Pulizia cache e dati locali dei turni…</p></div><script>(async()=>{try{['tm_planner_draft','tm_monthly_absences_v1','tm_monthly_manual_overrides_v1','tm_monthly_auto_fixes_v1','tm_monthly_balance_v1','tm_monthly_coverage_v1','tm_monthly_streak_v1'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('tm_full_turnistica_reset_v90','1');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('s').textContent='Reset completato. Apro il login in manutenzione…';setTimeout(()=>location.replace('index.html?v=90&maintenance=1&fresh='+Date.now()),250)}catch(e){document.getElementById('s').textContent='Reset locale parziale. Apro comunque l’app…';setTimeout(()=>location.replace('index.html?v=90&maintenance=1&fresh='+Date.now()),800)}})();</script></body></html>
