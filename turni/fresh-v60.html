<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0067b1"><title>Aggiornamento Turni v60</title><style>body{font-family:system-ui;background:#f4f7f9;color:#003d7c;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;border:1px solid #dbe5ec;border-radius:18px;padding:22px;max-width:360px;text-align:center}b{display:block;font-size:20px;margin-bottom:8px}</style></head><body><div class="box"><b>Aggiornamento Turni v60</b><div id="msg">Pulizia della vecchia versione…</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}document.getElementById('msg').textContent='Versione nuova caricata.';setTimeout(()=>location.replace('new-turns.html?v=60&fresh='+Date.now()),300)}catch(e){location.replace('new-turns.html?v=60&fresh='+Date.now())}})();</script></body></html>
