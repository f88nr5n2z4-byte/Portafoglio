<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0067b1"><title>Aggiornamento Turni v61</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f4f8fb;color:#003d7c;margin:0;padding:30px}.box{max-width:520px;margin:auto;background:#fff;border:1px solid #d7e3eb;border-radius:18px;padding:22px;text-align:center}.spin{font-size:34px}.msg{font-weight:850;margin-top:12px}</style></head><body><div class="box"><div class="spin">🔄</div><div class="msg" id="m">Aggiornamento alla versione 61…</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}localStorage.removeItem('tm_force_sw_v60');localStorage.removeItem('tm_force_sw_v61');document.getElementById('m').textContent='Aggiornamento completato. Apro i nuovi turni mensili…';setTimeout(()=>location.replace('new-turns.html?v=61&fresh=1'),400)}catch(e){document.getElementById('m').textContent='Aggiornamento completato parzialmente. Apro comunque i nuovi turni…';setTimeout(()=>location.replace('new-turns.html?v=61&fresh=1'),700)}})();</script></body></html>
