<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiornamento v82</title></head><body><div style="font-family:system-ui;padding:24px">Aggiorno l'app senza cancellare la bozza…</div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}location.replace('new-turns.html?v=82&fresh='+Date.now())}catch(e){location.replace('new-turns.html?v=82&fresh='+Date.now())}})();</script></body></html>
