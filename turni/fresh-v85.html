<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiornamento Turni v85</title></head><body><p style="font-family:system-ui;padding:20px">Aggiornamento in corso…</p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){const ks=await caches.keys();for(const k of ks)await caches.delete(k)}}catch(e){}location.replace('new-turns.html?v=85&fresh='+Date.now())})();</script></body></html>
