<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0067b1"><title>Aggiornamento Turni v91</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#003d7c;margin:0;padding:24px}.box{max-width:520px;margin:15vh auto;background:#fff;border:1px solid #dbe5ec;border-radius:20px;padding:22px;border-bottom:6px solid #ffd100}.bar{height:5px;background:#ffd100;border-radius:999px;margin-top:16px}</style></head><body><div class="box"><b>Nuova turnistica v91</b><p id="s">Aggiornamento della cache…</p><div class="bar"></div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('s').textContent='Pronto. Apro il nuovo generatore…';setTimeout(()=>location.replace('new-turns.html?v=91&fresh='+Date.now()),250)}catch(e){document.getElementById('s').textContent='Apro comunque il nuovo generatore…';setTimeout(()=>location.replace('new-turns.html?v=91&fresh='+Date.now()),700)}})();</script></body></html>
