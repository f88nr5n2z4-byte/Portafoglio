<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset=".45" stop-color="#11131c"/><stop offset="1" stop-color="#07040c"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292d35"/><stop offset="1" stop-color="#090b10"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243345" stop-opacity=".72"/><stop offset="1" stop-color="#0a0e15" stop-opacity=".9"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46505c"/><stop offset=".3" stop-color="#151a22"/><stop offset=".7" stop-color="#080b10"/><stop offset="1" stop-color="#303844"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b3038"/><stop offset="1" stop-color="#090c12"/></linearGradient>
 <radialGradient id="redGlow"><stop stop-color="#ff214b" stop-opacity=".72"/><stop offset="1" stop-color="#ff214b" stop-opacity="0"/></radialGradient>
 <radialGradient id="violetGlow"><stop stop-color="#d83cff" stop-opacity=".62"/><stop offset="1" stop-color="#d83cff" stop-opacity="0"/></radialGradient>
 <radialGradient id="blueGlow"><stop stop-color="#2db8ff" stop-opacity=".5"/><stop offset="1" stop-color="#2db8ff" stop-opacity="0"/></radialGradient>
 <pattern id="tiles" width="150" height="120" patternUnits="userSpaceOnUse"><rect width="150" height="120" fill="#171b22"/><path d="M0 0H150V120H0Z" fill="none" stroke="#353a43" stroke-width="2"/><path d="M0 118L150 4" stroke="#20242b" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<ellipse cx="1350" cy="420" rx="650" ry="430" fill="url(#violetGlow)" filter="url(#soft)"/>
<ellipse cx="1040" cy="780" rx="560" ry="340" fill="url(#redGlow)" filter="url(#soft)"/>
<ellipse cx="1690" cy="730" rx="430" ry="300" fill="url(#blueGlow)" filter="url(#soft)"/>
<!-- 2.5D room -->
<polygon points="610,150 1885,215 1780,1040 540,1040" fill="url(#tiles)" stroke="#343b46" stroke-width="5"/>
<polygon points="650,90 1910,150 1885,330 620,280" fill="#0a0e15" stroke="#2e3540" stroke-width="5"/>
<path d="M680 270L1880 325" stroke="#ff244a" stroke-width="9" filter="url(#glow)"/>
<path d="M760 180L1220 202" stroke="#cf32ff" stroke-width="6"/><path d="M1340 208L1810 230" stroke="#28b7ff" stroke-width="6"/>
<!-- premium sign -->
<g filter="url(#glow)"><rect x="1030" y="125" width="520" height="105" rx="10" fill="#05070a" stroke="#6b1830" stroke-width="4"/><text x="1120" y="174" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#f8f8fb">PC GAME</text><text x="1268" y="207" font-family="Arial,sans-serif" font-size="43" font-weight="900" font-style="italic" fill="#ff294d">EMPIRE</text></g>
<!-- left glass display -->
<polygon points="670,315 970,330 925,875 620,900" fill="url(#glass)" stroke="#536075" stroke-width="4"/>
<g fill="#0c1017" stroke="#4d5b70" stroke-width="3">
 <rect x="700" y="365" width="205" height="125" rx="8"/><rect x="688" y="515" width="205" height="125" rx="8"/><rect x="676" y="665" width="205" height="125" rx="8"/>
</g>
<g fill="#1f2f4e"><rect x="720" y="388" width="165" height="78"/><rect x="708" y="538" width="165" height="78"/><rect x="696" y="688" width="165" height="78"/></g>
<g fill="none" stroke-width="8"><circle cx="750" cy="427" r="25" stroke="#ef2343"/><circle cx="825" cy="427" r="25" stroke="#d832ff"/><circle cx="738" cy="577" r="25" stroke="#26b7ff"/><circle cx="813" cy="577" r="25" stroke="#9b35ff"/><circle cx="726" cy="727" r="25" stroke="#ef2343"/><circle cx="801" cy="727" r="25" stroke="#25d5d0"/></g>
<!-- central desk and displays -->
<polygon points="1080,575 1530,595 1600,650 1008,636" fill="#3b414a" stroke="#707b8b" stroke-width="4"/>
<polygon points="1008,636 1600,650 1575,805 1030,792" fill="url(#desk)" stroke="#46505d" stroke-width="4"/>
<path d="M1055 765L1550 778" stroke="#ff244a" stroke-width="10" filter="url(#glow)"/>
<g fill="#080b11" stroke="#5e6877" stroke-width="4"><rect x="1120" y="500" width="165" height="108" rx="6"/><rect x="1350" y="510" width="165" height="108" rx="6"/></g>
<g><rect x="1138" y="518" width="129" height="72" fill="#142b4b"/><rect x="1368" y="528" width="129" height="72" fill="#35164b"/></g>
<!-- right product wall -->
<polygon points="1640,340 1875,350 1815,910 1585,892" fill="#0a0f16" stroke="#3c4756" stroke-width="4"/>
<g fill="#111824" stroke="#435062" stroke-width="3"><rect x="1665" y="390" width="160" height="125"/><rect x="1647" y="545" width="160" height="125"/><rect x="1630" y="700" width="160" height="125"/></g>
<g fill="none" stroke-width="8"><circle cx="1710" cy="435" r="31" stroke="#d631ff"/><circle cx="1780" cy="435" r="31" stroke="#2ab8ff"/><circle cx="1692" cy="590" r="31" stroke="#ef2343"/><circle cx="1762" cy="590" r="31" stroke="#9b35ff"/><circle cx="1675" cy="745" r="31" stroke="#2ac7ff"/><circle cx="1745" cy="745" r="31" stroke="#ff2b54"/></g>
<!-- foreground gaming towers -->
<g fill="url(#metal)" stroke="#637084" stroke-width="4"><rect x="930" y="710" width="120" height="245" rx="9"/><rect x="1560" y="720" width="120" height="245" rx="9"/></g>
<g fill="none" stroke-width="9"><circle cx="990" cy="770" r="37" stroke="#d832ff"/><circle cx="990" cy="860" r="37" stroke="#28b7ff"/><circle cx="1620" cy="780" r="37" stroke="#ef2343"/><circle cx="1620" cy="870" r="37" stroke="#8e34ff"/></g>
<!-- floor reflections -->
<path d="M1045 797L1555 810L1450 1040L920 1040Z" fill="#ef2343" opacity=".09"/>
<path d="M1650 895L1800 910L1750 1040L1580 1040Z" fill="#2ab8ff" opacity=".08"/>
<path d="M650 900L920 875L930 1040L600 1040Z" fill="#ce36ff" opacity=".08"/>
<!-- ceiling rails -->
<g stroke-linecap="round"><path d="M710 120L1835 175" stroke="#111720" stroke-width="22"/><path d="M760 134L990 145" stroke="#ff294d" stroke-width="5" filter="url(#glow)"/><path d="M1210 156L1450 168" stroke="#d73dff" stroke-width="5" filter="url(#glow)"/><path d="M1595 177L1815 188" stroke="#2ab8ff" stroke-width="5" filter="url(#glow)"/></g>
</svg>