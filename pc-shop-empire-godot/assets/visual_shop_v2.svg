<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171c24"/><stop offset="1" stop-color="#080b10"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#566270"/><stop offset=".25" stop-color="#202631"/><stop offset=".75" stop-color="#090c12"/><stop offset="1" stop-color="#39414d"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25405a" stop-opacity=".62"/><stop offset="1" stop-color="#0a0f17" stop-opacity=".88"/></linearGradient>
 <pattern id="floor" width="120" height="100" patternUnits="userSpaceOnUse"><rect width="120" height="100" fill="#1b1f25"/><path d="M0 0H120V100H0Z" fill="none" stroke="#353b44" stroke-width="2"/><path d="M0 98L120 3" stroke="#242931"/></pattern>
 <radialGradient id="r"><stop stop-color="#ff244a" stop-opacity=".45"/><stop offset="1" stop-color="#ff244a" stop-opacity="0"/></radialGradient>
 <radialGradient id="p"><stop stop-color="#d633ff" stop-opacity=".38"/><stop offset="1" stop-color="#d633ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="b"><stop stop-color="#2ab7ff" stop-opacity=".35"/><stop offset="1" stop-color="#2ab7ff" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1920" height="1080" fill="#05080d"/>
